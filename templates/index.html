<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Marks Predictor</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            width:400px;
            box-shadow:0 5px 20px rgba(0,0,0,0.15);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#007bff;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#007bff;
            color:white;
            font-size:16px;
            cursor:pointer;
            margin-top:10px;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            padding:15px;
            background:#e8f5e9;
            border-radius:8px;
            color:#2e7d32;
            font-weight:bold;
        }

        .info{
            margin-bottom:20px;
            color:#666;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🎓 Student Marks Predictor</h1>

    <p class="info">
        Enter student details and predict marks instantly.
    </p>

    <form action="/predict" method="post">

        <input
            type="number"
            name="age"
            placeholder="Enter Age"
            required>

        <input
            type="number"
            name="gender"
            placeholder="Gender (Male=1, Female=0)"
            required>

        <input
            type="number"
            name="hours"
            placeholder="Study Hours"
            required>

        <input
            type="number"
            name="attendance"
            placeholder="Attendance %"
            required>

        <button type="submit">
            Predict Marks
        </button>

    </form>

    {% if result %}
    <div class="result">
        Predicted Marks: {{ result }}
    </div>
    {% endif %}

</div>

</body>
</html>
